<!doctype html>
<html lang="en" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bootstrap Color Picker</title>
    <link href="../vendor/twbs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/twbs/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --blur-amount: 15px;
        }

        body {
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .glass-card {
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        #eventLog {
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.825rem;
            scrollbar-width: thin;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 0.5rem;
        }

        .smaller {
            font-size: 0.75rem;
        }

        .event-item.event-update { border-left-color: #0d6efd; }
        .event-item.event-change { border-left-color: #198754; }
        .event-item.event-show { border-left-color: #ffc107; }
        .event-item.event-hide { border-left-color: #6c757d; }

        .json-key { color: #888; }
        .json-value { color: #0dcaf0; }
        .json-string { color: #20c997; }
        
        /* Ensure dropdown is always on top */
        .col-lg-5 {
            position: relative;
            z-index: 10;
        }
        .col-lg-7 {
            position: relative;
            z-index: 1;
        }
        .dropdown {
            position: relative;
            z-index: 1060; /* Higher than other glass cards if necessary */
        }
        .dropdown-menu.show {
            z-index: 9999 !important;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row g-4 align-items-stretch">
        <div class="col-lg-5">
            <div class="glass-card p-4 h-100">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">Color Picker</h2>
                    <p class="text-muted small">Modern & Responsive Bootstrap Plugin</p>
                </div>

                <div class="mb-4">
                    <input id="colorPicker" type="text" name="color" value="#0d6efd"
                           data-btn-class="btn-primary btn-lg d-block w-100 rounded-pill shadow"
                           class="form-control">
                </div>

                <hr class="my-4 opacity-10">

                <form id="optionsForm">
                    <div class="form-floating mb-3">
                        <select class="form-select border-0 bg-opacity-10 bg-dark" name="format" id="selectOutputFormat">
                            <option value="rgba">RGBA</option>
                            <option value="rgb">RGB</option>
                            <option value="hex" selected>HEX</option>
                            <option value="hsl">HSL</option>
                            <option value="hsla">HSLA</option>
                        </select>
                        <label for="selectOutputFormat">Output Format</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" name="btnText" class="form-control border-0 bg-opacity-10 bg-dark"
                               value="Pick a Color" id="selectOutputBtnText" placeholder="Button Text">
                        <label for="selectOutputBtnText">Button Text</label>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" name="disabled" type="checkbox" role="switch" id="switchDisabled">
                        <label class="form-check-label" for="switchDisabled">Disabled state</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm hover-lift">
                        Apply Configuration
                    </button>
                </form>

                <hr class="my-4 opacity-10">

                <div class="d-flex gap-2 align-items-end">
                    <div class="form-floating flex-grow-1">
                        <select class="form-select border-0 bg-opacity-10 bg-dark" id="randomFormat">
                            <option value="rgba" selected>RGBA</option>
                            <option value="rgb">RGB</option>
                            <option value="hex">HEX</option>
                            <option value="hsl">HSL</option>
                            <option value="hsla">HSLA</option>
                        </select>
                        <label for="randomFormat">Random Format</label>
                    </div>
                    <div class="form-floating" style="width: 120px;">
                        <input type="number" min="0" max="1" step="0.01" value="1"
                               class="form-control border-0 bg-opacity-10 bg-dark"
                               id="randomAlpha" placeholder="Alpha">
                        <label for="randomAlpha">Alpha</label>
                    </div>
                    <button type="button" class="btn btn-outline-light py-3" id="randomColor">
                        <i class="bi bi-shuffle"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-card p-0 overflow-hidden h-100 d-flex flex-column">
                <div class="p-3 border-bottom border-white border-opacity-10 d-flex justify-content-between align-items-center bg-dark bg-opacity-10">
                    <span class="fw-bold small px-2">Live Events</span>
                    <button class="btn btn-sm btn-outline-secondary border-0" id="clearLog">
                        <i class="bi bi-trash3-fill me-1"></i> Clear
                    </button>
                </div>
                <div class="flex-grow-1 p-0">
                    <pre id="eventLog" class="mb-0 p-4 font-monospace"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../vendor/components/jquery/jquery.min.js"></script>
<script src="../vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="../dist/bs-color-picker.js"></script>

<script>
    $(function () {
        const $body = $('body');
        const $html = $('html');
        const $colorPicker = $('#colorPicker');
        const $eventLog = $('#eventLog');

        function logEvent(message, data = null) {
            const now = new Date();
            const time = now.toLocaleTimeString([], {hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'});
            
            let dataHtml = '';
            if (data) {
                // Einfache JSON-Formatierung für schönere Anzeige
                const json = JSON.stringify(data, null, 2)
                    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                    .replace(/: (true|false|null|\d+(\.\d+)?)/g, ': <span class="json-value">$1</span>')
                    .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>');
                dataHtml = `<div class="mt-2 p-2 bg-dark bg-opacity-25 rounded"><pre class="mb-0 small" style="white-space: pre-wrap;">${json}</pre></div>`;
            }

            const logEntry = $(`
                <div class="event-item event-${message} mb-0 p-3 border-bottom border-white border-opacity-10">
                    <div class="d-flex align-items-center justify-content-between">
                        <span class="fw-bold text-uppercase small" style="letter-spacing: 1px;">${message}</span>
                        <span class="text-muted smaller font-monospace">${time}</span>
                    </div>
                    ${dataHtml}
                </div>
            `).hide();

            $eventLog.prepend(logEntry);
            logEntry.slideDown(200);
        }

        function updateBackground(rgba) {
            if (!rgba) {
                const color = $colorPicker.bsColorPicker('getColor');
                rgba = color ? color.rgba : {r: 13, g: 110, b: 253, a: 1};
            }
            
            const baseColor = `rgba(${rgba.r}, ${rgba.g}, ${rgba.b}, ${rgba.a})`;
            const secondaryColor = '#000000';
            
            $body.css({
                'background-image': `radial-gradient(circle at 20% 30%, ${baseColor} 0%, ${secondaryColor} 150%)`
            });
        }

        // Init Color Picker
        $colorPicker.bsColorPicker({
            btnClass: 'btn-lg btn-primary rounded-pill shadow-sm',
            btnText: 'Pick a Color',
            format: 'hex',
            hideInputs: false
        });

        // Event Handlers
        $colorPicker
            .on('update.bs.colorPicker', (e, data) => {
                if (data) updateBackground(data.rgba);
                logEvent('update', data);
            })
            .on('change.bs.colorPicker', (e, data) => logEvent('change', data))
            .on('show.bs.colorPicker', () => logEvent('show'))
            .on('hide.bs.colorPicker', () => logEvent('hide'));

        $('#clearLog').on('click', () => $eventLog.empty());

        $('#optionsForm').on('submit', function (e) {
            e.preventDefault();
            const data = {};
            $(this).serializeArray().forEach(item => {
                data[item.name] = item.value;
            });
            data.disabled = $('#switchDisabled').is(':checked');
            
            $colorPicker.bsColorPicker('updateOptions', data);
        });

        $('#randomColor').on('click', function () {
            const format = $('#randomFormat').val();
            const alpha = parseFloat($('#randomAlpha').val());
            const color = $.bsColorPicker.utils.getRandomColor(format, alpha);

            if (color) {
                $colorPicker.bsColorPicker('updateOptions', {format});
                $colorPicker.bsColorPicker('val', color);
                logEvent('random', color);
            }
        });

        // Initial background
        updateBackground();
    });
</script>
</body>
</html>
